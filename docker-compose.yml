version: '3.8'

services:
  shieldguard-api:
    build: .
    container_name: shieldguard-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Optional Cloud Security API Keys (Free Tiers):
      # - GOOGLE_SAFE_BROWSING_KEY=your_key_here
      # - VIRUSTOTAL_API_KEY=your_key_here
      # - GEMINI_API_KEY=your_key_here
